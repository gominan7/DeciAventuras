# Configuración del proyecto Gradle para DeciAventuras
# Tamaño de heap para la JVM de Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Habilita AndroidX (obligatorio para Jetpack Compose y librerías androidx.*)
android.useAndroidX=true

# No usar Jetifier: todas las dependencias declaradas ya son AndroidX-nativas
android.enableJetifier=false

# Kotlin genera código Java 8+ (requerido por Compose)
kotlin.code.style=official

# Ejecución en paralelo y caché para builds más rápidos y reproducibles
org.gradle.parallel=true
org.gradle.caching=true

# No usar versiones dinámicas / resolución no determinista
android.nonTransitiveRClass=true
